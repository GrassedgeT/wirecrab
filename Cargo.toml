[package]
name = "wirecrab"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
etherparse = "0.19.0"
pcap = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
egui = "0.33.0"
eframe = "0.33.0"
crossbeam = "0.8.4"
egui_extras = "0.33.0"



[[bin]]
name = "wirecrab-gui"
path = "src/bin/gui.rs"
